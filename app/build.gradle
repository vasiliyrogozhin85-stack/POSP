    namespace "com.vasiliyrogozhin85.upospa"
    compileSdk 36

    defaultConfig {
        applicationId "com.vasiliyrogozhin85.upospa"
        minSdk 21
        targetSdk 36
        versionCode 81
        versionName "0.8-beta-wizard"

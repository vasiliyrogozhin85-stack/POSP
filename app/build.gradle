plugins { id 'com.android.application' }

android {
    namespace 'com.openai.phoneosprofiler'
    compileSdk 36

    signingConfigs {
        pospDev {
            storeFile file('signing/posp-dev.jks')
            storePassword 'pospdev2026'
            keyAlias 'pospdev'
            keyPassword 'pospdev2026'
        }
    }

    defaultConfig {
        // New stable applicationId avoids signature conflict with v0.2-v0.4.
        applicationId 'com.vasiliyrogozhin85.posp'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5'
    }

    buildTypes {
        debug { signingConfig signingConfigs.pospDev }
        release {
            signingConfig signingConfigs.pospDev
            minifyEnabled false
        }
    }
}

dependencies { implementation 'androidx.core:core:1.17.0' }

plugins { id 'com.android.application' }

android {
    namespace 'com.vasiliyrogozhin85.posphost'
    compileSdk 36

    signingConfigs {
        hostDev {
            storeFile file('signing/posp-host-dev.jks')
            storePassword 'posphost2026'
            keyAlias 'posphostdev'
            keyPassword 'posphost2026'
        }
    }

    defaultConfig {
        applicationId 'com.vasiliyrogozhin85.posphost'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.7'
    }

    buildTypes {
        debug { signingConfig signingConfigs.hostDev }
        release {
            signingConfig signingConfigs.hostDev
            minifyEnabled false
        }
    }
}

dependencies { implementation 'androidx.core:core:1.17.0' }

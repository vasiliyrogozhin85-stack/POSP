name: Build uPOSPa 0.8 beta Wizard APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "upospa-unified-v0.8-beta-wizard"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk uPOSPa_v0.8_beta_wizard_debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uPOSPa-v0.8-beta-wizard-debug
          path: uPOSPa_v0.8_beta_wizard_debug.apk
          if-no-files-found: error

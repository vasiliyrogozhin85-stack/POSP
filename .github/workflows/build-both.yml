name: Build POSP Host and Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "host-app/**"
      - "client-app/**"
      - "common/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-both.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Decode stable dev signing keys
        shell: bash
        run: |
          set -euo pipefail
          base64 -d host-app/signing/posp-host-dev.jks.b64 > host-app/signing/posp-host-dev.jks
          base64 -d client-app/signing/posp-client-dev.jks.b64 > client-app/signing/posp-client-dev.jks
          test -s host-app/signing/posp-host-dev.jks
          test -s client-app/signing/posp-client-dev.jks

      - name: Build Host
        run: gradle --no-daemon :host-app:assembleDebug

      - name: Build Client
        run: gradle --no-daemon :client-app:assembleDebug

      - name: Upload Host APK
        uses: actions/upload-artifact@v4
        with:
          name: POSP-Host-v0.10-debug
          path: host-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: POSP-Client-v0.3-debug
          path: client-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

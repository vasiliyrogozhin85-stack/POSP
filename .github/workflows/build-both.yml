name: Build POSP Host and Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "host-app/**"
      - "client-app/**"
      - "common/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-both.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build Host
        run: gradle :host-app:assembleDebug

      - name: Build Client
        run: gradle :client-app:assembleDebug

      - name: Upload Host
        uses: actions/upload-artifact@v4
        with:
          name: POSP-Host-v0.8-debug
          path: host-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Client
        uses: actions/upload-artifact@v4
        with:
          name: POSP-Client-v0.1-debug
          path: client-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

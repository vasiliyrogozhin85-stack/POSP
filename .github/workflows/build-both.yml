name: Build POSP Host and Client
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "host-app/**", "client-app/**", "common/**", "build.gradle", "settings.gradle", "gradle.properties", ".github/workflows/build-both.yml" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.1" }
      - name: Decode stable dev signing keys
        run: |
          base64 -d host-app/signing/posp-host-dev.jks.b64 > host-app/signing/posp-host-dev.jks
          base64 -d client-app/signing/posp-client-dev.jks.b64 > client-app/signing/posp-client-dev.jks
      - name: Build Host
        run: gradle :host-app:assembleDebug
      - name: Build Client
        run: gradle :client-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: POSP-Host-v0.9-debug
          path: host-app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: POSP-Client-v0.2-debug
          path: client-app/build/outputs/apk/debug/*.apk

name: Build POSP Host and Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Host
        run: gradle :host-app:assembleDebug

      - name: Build Client
        run: gradle :client-app:assembleDebug

      - name: Upload Host APK
        uses: actions/upload-artifact@v4
        with:
          name: POSP-Host-debug
          path: host-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: POSP-Client-debug
          path: client-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
